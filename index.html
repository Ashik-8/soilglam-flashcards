<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SOILGLAM — Flashcards</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#050304; --ink-2:#0a0608; --ink-3:#12090e;
    --wine:#4a0f2e; --wine-2:#6b1539; --wine-3:#8b1a4a;
    --rose:#c2185b; --rose-bright:#e91e63;
    --gold:#d4af7a; --gold-bright:#e8c891; --gold-dim:#8a7350;
    --text:#f5e6ec; --text-dim:rgba(245,230,236,.6); --text-faint:rgba(245,230,236,.3);
    --hairline:rgba(212,175,122,.15); --hairline-strong:rgba(212,175,122,.35);
    --glass:rgba(18,9,14,.6);
    --success:#4caf7d; --error:#e63950;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{min-height:100%;overflow-x:hidden}
  body{
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    min-height:100vh;color:var(--text);
    background:var(--ink);
    background-image:
      radial-gradient(ellipse 80% 50% at 50% -20%, rgba(139,26,74,.3) 0%, transparent 70%),
      radial-gradient(ellipse 50% 50% at 100% 100%, rgba(74,15,46,.2) 0%, transparent 70%);
    background-attachment:fixed;
    padding:0 0 100px;
    letter-spacing:.1px;
    -webkit-font-smoothing:antialiased;
    position:relative;
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:1;
    opacity:.03; mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  }
  button{font-family:inherit;cursor:pointer;border:none;color:var(--text);letter-spacing:.4px;background:transparent}
  input,select,textarea{font-family:inherit;outline:none}
  ::-webkit-scrollbar{width:4px}
  ::-webkit-scrollbar-thumb{background:var(--gold-dim);border-radius:4px}

  /* ГЛАВНЫЙ ХЕДЕР */
  .app-header{
    position:sticky;top:0;z-index:50;
    padding:16px 20px 12px;
    background:linear-gradient(180deg, var(--ink) 0%, rgba(5,3,4,.8) 70%, transparent 100%);
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    display:flex;justify-content:space-between;align-items:center;
  }
  .brand{
    font-family:'Cormorant Garamond',Georgia,serif;
    font-size:1.3rem;font-weight:600;letter-spacing:.3em;text-transform:uppercase;
    background:linear-gradient(120deg,var(--gold-bright) 0%,var(--gold) 50%,var(--gold-dim) 100%);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
    text-indent:.3em;
  }

  /* БЛОК КОЛОД */
  .deck-management{
    padding:0 20px;max-width:600px;margin:0 auto 20px;position:relative;z-index:40;
  }
  .deck-scroll{
    display:flex;gap:8px;overflow-x:auto;padding:10px 0 16px;
    scrollbar-width:none;scroll-behavior:smooth;
  }
  .deck-scroll::-webkit-scrollbar{display:none}
  .deck-chip{
    flex-shrink:0;padding:10px 16px;border-radius:12px;
    font-size:.75rem;font-weight:500;letter-spacing:.1em;
    background:var(--glass);border:1px solid var(--hairline);
    color:var(--text-dim);transition:all .3s cubic-bezier(.4,0,.2,1);
    display:flex;align-items:center;gap:10px;
  }
  .deck-chip .deck-name{max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .deck-chip .count{
    font-size:.65rem;background:rgba(255,255,255,.1);
    padding:2px 8px;border-radius:99px;min-width:22px;text-align:center;
  }
  .deck-chip.active{
    background:linear-gradient(135deg,var(--gold-bright) 0%,var(--gold) 100%);
    color:var(--ink);border-color:transparent;
    box-shadow:0 4px 20px rgba(212,175,122,.3);
    font-weight:600;
  }
  .deck-chip.active .count{background:rgba(0,0,0,.2);color:var(--ink)}
  .deck-chip:active{transform:scale(.96)}
  
  .btn-add-deck{
    flex-shrink:0;padding:10px 16px;border-radius:12px;
    font-size:.75rem;font-weight:500;letter-spacing:.1em;
    background:transparent;border:1px dashed var(--gold-dim);
    color:var(--gold);transition:all .3s;
    display:flex;align-items:center;gap:6px;
  }
  .btn-add-deck:active{background:rgba(212,175,122,.1);transform:scale(.96)}

  /* ОСНОВНОЙ КОНТЕНТ */
  .main-content{padding:0 20px;max-width:600px;margin:0 auto;position:relative;z-index:2}
  
  /* СЕКЦИЯ УЧЕБЫ */
  .study-area{display:flex;flex-direction:column;align-items:center;animation:fadeIn .4s ease}
  
  .study-stats{display:flex;justify-content:center;gap:16px;margin-bottom:24px;width:100%}
  .study-stat{text-align:center;flex:1;background:var(--glass);border:1px solid var(--hairline);border-radius:12px;padding:12px 0}
  .study-stat .val{font-family:'Cormorant Garamond',Georgia,serif;font-size:1.4rem;font-weight:600;line-height:1}
  .study-stat .lbl{font-size:.55rem;color:var(--text-faint);text-transform:uppercase;letter-spacing:.1em;margin-top:6px;font-weight:500}
  .study-stat.total .val{color:var(--gold-bright)}
  .study-stat.known .val{color:var(--success)}
  .study-stat.unknown .val{color:var(--error)}
  
  .progress-track{width:100%;height:4px;background:rgba(255,255,255,.05);border-radius:99px;overflow:hidden;margin-bottom:32px;position:relative}
  .progress-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--gold-dim),var(--gold-bright));transition:width .6s cubic-bezier(.4,0,.2,1);box-shadow:0 0 12px var(--gold)}

  /* КАРТОЧКА (3D-ИЗОЛЯЦИЯ) */
  .scene{
    width:100%;max-width:360px;height:280px;
    perspective:1500px;cursor:pointer;margin:0 auto 32px;
  }
  .card{
    position:relative;width:100%;height:100%;transform-style:preserve-3d;
    transition:transform .6s cubic-bezier(.6,.05,.2,1);
  }
  .card.flipped{transform:rotateY(180deg)}
  .face{
    position:absolute;inset:0;border-radius:16px;
    display:flex;align-items:center;justify-content:center;
    padding:32px;text-align:center;
    backface-visibility:hidden; -webkit-backface-visibility:hidden;
    transform:translateZ(1px); 
    overflow:hidden;
    border:1px solid var(--hairline-strong);
    box-shadow:0 20px 40px rgba(0,0,0,.6);
  }
  .front{
    background:radial-gradient(ellipse at 50% 0%, rgba(139,26,74,.4) 0%, transparent 60%), linear-gradient(160deg,#12090e 0%,#050304 100%);
    z-index:2;
  }
  .front::after{
    content:"";position:absolute;top:-20%;left:50%;transform:translateX(-50%);
    width:80%;height:60%;border-radius:50%;
    background:radial-gradient(circle, rgba(233,30,99,.2) 0%, transparent 70%);
    filter:blur(40px);pointer-events:none;
  }
  .back{
    background:radial-gradient(ellipse at 50% 100%, rgba(212,175,122,.15) 0%, transparent 60%), linear-gradient(160deg,#4a0f2e 0%,#2a081a 100%);
    transform:rotateY(180deg) translateZ(1px);
    z-index:1;
  }
  .word{
    font-family:'Cormorant Garamond',Georgia,serif;
    font-size:clamp(2rem,6vw,2.6rem);font-weight:600;
    position:relative;z-index:1;color:var(--rose-pale);
    line-height:1.15;word-break:break-word;
    text-shadow:0 2px 20px rgba(0,0,0,.6);
  }
  .back .word{color:#fff;text-shadow:0 2px 20px rgba(0,0,0,.4),0 0 30px rgba(212,175,122,.2)}
  
  .card.correct .front,.card.correct .back{border-color:var(--success);box-shadow:0 0 30px rgba(76,175,125,.3)}
  .card.wrong .front,.card.wrong .back{border-color:var(--error);box-shadow:0 0 30px rgba(230,57,80,.3)}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}
  .scene.shake{animation:shake .4s}

  /* КНОПКИ УПРАВЛЕНИЯ */
  .study-controls{display:flex;gap:12px;width:100%;max-width:360px;margin:0 auto}
  .btn-action{
    flex:1;padding:16px 0;border-radius:12px;
    font-size:.75rem;font-weight:600;letter-spacing:.15em;text-transform:uppercase;
    transition:all .2s;display:flex;align-items:center;justify-content:center;
  }
  .btn-action:disabled{opacity:.3;pointer-events:none}
  .btn-action:active{transform:scale(.96)}
  .btn-flip{background:var(--glass);border:1px solid var(--hairline);color:var(--gold-bright)}
  .btn-know{background:linear-gradient(135deg,var(--success),#2e8b5f);color:#fff;box-shadow:0 4px 15px rgba(76,175,125,.2)}
  .btn-dont{background:rgba(230,57,80,.1);border:1px solid rgba(230,57,80,.3);color:#f0a8b8}

  /* РЕЗУЛЬТАТЫ И РАБОТА НАД ОШИБКАМИ */
  .finish-screen{
    text-align:center;padding:20px;width:100%;max-width:360px;margin:0 auto;
    background:var(--glass);border:1px solid var(--hairline-strong);border-radius:20px;
    animation:slideUp .4s ease;
  }
  .finish-screen h2{font-family:'Cormorant Garamond',Georgia,serif;font-size:1.8rem;color:var(--gold-bright);letter-spacing:.1em;margin-bottom:10px}
  .finish-screen p{color:var(--text-dim);font-size:.9rem;margin-bottom:20px}
  .error-list{
    text-align:left;max-height:200px;overflow-y:auto;
    background:rgba(0,0,0,.3);border-radius:12px;padding:10px;margin-bottom:20px;
  }
  .error-item{padding:10px;border-bottom:1px solid var(--hairline);display:flex;flex-direction:column;gap:4px}
  .error-item:last-child{border:none}
  .error-item .f{font-family:'Cormorant Garamond',Georgia,serif;font-size:1.1rem;color:#f0a8b8;font-weight:600}
  .error-item .b{font-size:.8rem;color:var(--text-dim);font-style:italic}
  
  .btn-restart{width:100%;padding:16px;border-radius:12px;background:var(--glass);border:1px solid var(--hairline);color:var(--text);font-size:.75rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase}
  .btn-retry-errors{width:100%;padding:16px;border-radius:12px;background:linear-gradient(135deg,var(--gold-bright),var(--gold));color:var(--ink);font-size:.75rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;margin-bottom:12px}

  /* СЕКЦИЯ УПРАВЛЕНИЯ СЛОВАМИ */
  .manage-area{animation:fadeIn .4s ease}
  .add-word-card{background:var(--glass);border:1px solid var(--hairline);border-radius:16px;padding:20px;margin-bottom:24px;backdrop-filter:blur(10px)}
  .add-word-title{font-family:'Cormorant Garamond',Georgia,serif;font-size:1.1rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-bright);margin-bottom:16px}
  .input-row{display:flex;flex-direction:column;gap:12px;margin-bottom:16px}
  .input-group{display:flex;flex-direction:column;gap:6px}
  .input-group label{font-size:.6rem;text-transform:uppercase;letter-spacing:.15em;color:var(--text-faint);font-weight:600}
  .input-group input{padding:14px 16px;border-radius:10px;background:rgba(0,0,0,.4);border:1px solid var(--hairline);color:var(--text);font-size:.95rem;transition:all .3s}
  .input-group input:focus{border-color:var(--gold);background:rgba(0,0,0,.6);box-shadow:0 0 0 2px rgba(212,175,122,.1)}
  
  .btn-add{width:100%;padding:16px;border-radius:10px;background:linear-gradient(135deg,var(--wine-3),var(--rose));font-size:.8rem;font-weight:600;letter-spacing:.15em;text-transform:uppercase;transition:all .2s}
  .btn-add:active{transform:scale(.98)}

  .words-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
  .words-title{font-family:'Cormorant Garamond',Georgia,serif;font-size:1.2rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--rose-pale)}
  .search-bar{display:flex;gap:10px;margin-bottom:16px}
  .search-bar input{flex:1;padding:12px 16px;border-radius:10px;background:rgba(255,255,255,.03);border:1px solid var(--hairline);color:var(--text);font-size:.85rem}

  .word-item{display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-bottom:1px solid var(--hairline);transition:all .2s}
  .word-item:active{background:rgba(255,255,255,.02)}
  .word-info{display:flex;flex-direction:column;gap:4px;flex:1;min-width:0;padding-right:12px}
  .word-info .front{font-family:'Cormorant Garamond',Georgia,serif;font-size:1.15rem;font-weight:600;color:var(--gold-bright);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .word-info .back{font-size:.8rem;color:var(--text-dim);font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  
  .word-actions{display:flex;gap:4px}
  .btn-icon{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.03);color:var(--text-dim);transition:all .2s;font-size:.9rem}
  .btn-icon:active{background:rgba(255,255,255,.1);color:var(--gold)}
  .btn-icon.danger:active{color:#e88a9c;background:rgba(230,57,80,.1)}

  .empty-state{text-align:center;padding:40px 20px;color:var(--text-faint);font-family:'Cormorant Garamond',Georgia,serif;font-size:1.1rem;font-style:italic}

  /* НИЖНЯЯ НАВИГАЦИЯ */
  .bottom-nav{
    position:fixed;bottom:0;left:0;right:0;z-index:50;
    background:rgba(5,3,4,.85);backdrop-filter:blur(20px);
    border-top:1px solid var(--hairline);
    display:flex;justify-content:center;padding:8px 20px;
    padding-bottom:max(8px, env(safe-area-inset-bottom));
  }
  .nav-item{flex:1;max-width:120px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;color:var(--text-faint);transition:all .3s}
  .nav-item .icon{font-size:1.2rem;margin-bottom:2px}
  .nav-item .label{font-size:.6rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase}
  .nav-item.active{color:var(--gold-bright)}
  .nav-item.active .icon{transform:translateY(-2px)}

  /* МОДАЛКИ */
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;z-index:100;padding:20px;animation:fadeIn .3s}
  .modal-overlay.show{display:flex}
  .modal{background:linear-gradient(160deg,var(--ink-3),var(--ink-2));border:1px solid var(--hairline-strong);border-radius:20px;padding:24px;width:100%;max-width:400px;box-shadow:0 30px 80px rgba(0,0,0,.9);animation:slideUp .3s ease}
  .modal h3{font-family:'Cormorant Garamond',Georgia,serif;font-size:1.3rem;font-weight:600;margin-bottom:20px;color:var(--gold-bright);letter-spacing:.1em;text-align:center}
  .modal-actions{display:flex;gap:10px;margin-top:24px}
  .modal-actions button{flex:1;padding:14px;border-radius:10px;font-weight:600;font-size:.75rem;letter-spacing:.1em;text-transform:uppercase}
  .btn-cancel{background:rgba(255,255,255,.05);color:var(--text-dim)}
  .btn-save{background:linear-gradient(135deg,var(--gold-bright),var(--gold));color:var(--ink)}

  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
  .hidden{display:none !important}
</style>
</head>
<body>

<header class="app-header">
  <div class="brand">SOILGLAM</div>
</header>

<div class="deck-management">
  <div class="deck-scroll" id="deckScroll"></div>
</div>

<main class="main-content">
  <!-- ЭКРАН УЧЕБЫ -->
  <section id="viewStudy" class="study-area">
    <div class="study-stats">
      <div class="study-stat total"><div class="val" id="statTotal">0</div><div class="lbl">Всего</div></div>
      <div class="study-stat known"><div class="val" id="statKnow">0</div><div class="lbl">Знаю</div></div>
      <div class="study-stat unknown"><div class="val" id="statDont">0</div><div class="lbl">Ошибки</div></div>
    </div>
    
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>

    <div id="studyCardContainer">
      <div class="scene" id="scene">
        <div class="card" id="card">
          <div class="face front"><div class="word" id="frontWord">—</div></div>
          <div class="face back"><div class="word" id="backWord">—</div></div>
        </div>
      </div>
      <div class="study-controls">
        <button class="btn-action btn-flip" id="btnFlip">Перевернуть</button>
        <button class="btn-action btn-know" id="btnKnow" disabled>Знаю</button>
        <button class="btn-action btn-dont" id="btnDont" disabled>Повторить</button>
      </div>
    </div>

    <!-- Экран пустой колоды -->
    <div id="studyEmpty" class="empty-state hidden">В этой колоде пока нет слов.</div>
    
    <!-- Экран завершения (с показом ошибок) -->
    <div id="studyFinish" class="finish-screen hidden">
      <h2>✦ Сессия завершена</h2>
      <p id="finishText"></p>
      <div id="errorListContainer" class="error-list hidden"></div>
      <button class="btn-retry-errors hidden" id="btnRetryErrors">Работа над ошибками</button>
      <button class="btn-restart" id="btnRestart">Пройти заново</button>
    </div>
  </section>

  <!-- ЭКРАН УПРАВЛЕНИЯ СЛОВАМИ -->
  <section id="viewManage" class="manage-area hidden">
    <div class="add-word-card">
      <div class="add-word-title">Добавить слово</div>
      <div class="input-row">
        <div class="input-group">
          <label>Иностранное слово</label>
          <input type="text" id="inpFront" placeholder="Serendipity" autocomplete="off">
        </div>
        <div class="input-group">
          <label>Перевод</label>
          <input type="text" id="inpBack" placeholder="Счастливая случайность" autocomplete="off">
        </div>
      </div>
      <button class="btn-add" id="btnAddWord">Сохранить</button>
    </div>

    <div class="words-header">
      <div class="words-title">Мои слова <span id="wordCount" style="font-size:.8rem;font-family:'Inter';color:var(--text-faint);margin-left:6px">0</span></div>
    </div>
    
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Поиск слов...">
    </div>

    <div id="wordList"></div>
  </section>
</main>

<nav class="bottom-nav">
  <button class="nav-item active" id="navStudy">
    <span class="icon">🃏</span><span class="label">Учить</span>
  </button>
  <button class="nav-item" id="navManage">
    <span class="icon">📝</span><span class="label">Слова</span>
  </button>
</nav>

<!-- МОДАЛКА РЕДАКТИРОВАНИЯ -->
<div class="modal-overlay" id="editModal">
  <div class="modal">
    <h3>Редактировать</h3>
    <div class="input-group" style="margin-bottom:12px">
      <label>Иностранное слово</label>
      <input type="text" id="editFront">
    </div>
    <div class="input-group">
      <label>Перевод</label>
      <input type="text" id="editBack">
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" id="btnCancelModal">Отмена</button>
      <button class="btn-save" id="btnSaveEdit">Сохранить</button>
    </div>
  </div>
</div>

<!-- МОДАЛКА СОЗДАНИЯ КОЛОДЫ -->
<div class="modal-overlay" id="deckModal">
  <div class="modal">
    <h3>Новая колода</h3>
    <div class="input-group">
      <input type="text" id="newDeckName" placeholder="Название колоды">
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" id="btnCancelDeck">Отмена</button>
      <button class="btn-save" id="btnCreateDeck">Создать</button>
    </div>
  </div>
</div>

<script>
/* ============================================================
   TELEGRAM INIT
   ============================================================ */
const tg = window.Telegram?.WebApp;
if (tg) {
  tg.ready(); tg.expand();
  tg.setHeaderColor('#050304'); tg.setBackgroundColor('#050304');
  tg.enableClosingConfirmation();
}

/* ============================================================
   ХРАНИЛИЩЕ
   ============================================================ */
const STORAGE_KEY = 'soilglam_v5';
const LAST_DECK_KEY = 'soilglam_last_deck_v5';

const DEFAULT_DECKS = [{ id: 'deck_1', name: 'English Core' }, { id: 'deck_2', name: 'Spanish A1' }];
const DEFAULT_WORDS = [
  { id: 1, front: "Serendipity", back: "Счастливая случайность", deckId: 'deck_1' },
  { id: 2, front: "Ephemeral", back: "Мимолётный", deckId: 'deck_1' },
  { id: 3, front: "Hola", back: "Привет", deckId: 'deck_2' },
];

let db = { decks: [], words: [], nextId: 100 };
let currentDeckId = null; 

function loadDB(callback) {
  const load = (data) => {
    if (data && Array.isArray(data.decks) && Array.isArray(data.words)) db = data;
    else db = { decks: [...DEFAULT_DECKS], words: [...DEFAULT_WORDS], nextId: 100 };
    callback();
  };
  if (tg && tg.CloudStorage) {
    tg.CloudStorage.getItem(STORAGE_KEY, (err, val) => {
      try { load(val ? JSON.parse(val) : null); } catch(e) { load(null); }
    });
  } else {
    try { load(JSON.parse(localStorage.getItem(STORAGE_KEY))); } catch(e) { load(null); }
  }
}

function saveDB() {
  const data = JSON.stringify(db);
  if (tg && tg.CloudStorage) tg.CloudStorage.setItem(STORAGE_KEY, data);
  else localStorage.setItem(STORAGE_KEY, data);
}

function saveLastDeck(id) {
  currentDeckId = id;
  if (tg && tg.CloudStorage) tg.CloudStorage.setItem(LAST_DECK_KEY, id);
  else localStorage.setItem(LAST_DECK_KEY, id);
}

function loadLastDeck(callback) {
  const load = (id) => { currentDeckId = id; callback(); };
  if (tg && tg.CloudStorage) tg.CloudStorage.getItem(LAST_DECK_KEY, (err, val) => load(val));
  else load(localStorage.getItem(LAST_DECK_KEY));
}

/* ============================================================
   УТИЛИТЫ И СОСТОЯНИЕ
   ============================================================ */
const $ = (id) => document.getElementById(id);
const uid = () => 'w' + Date.now() + Math.floor(Math.random() * 1000);

let currentView = 'study';
let studyQueue = [];
let currentStudyWord = null;
let isFlipped = false, answered = false;
let studyStats = { know: 0, dont: 0 };
let sessionErrors = []; // Массив слов с ошибками
let editingWordId = null;

function getDeckWords(deckId) { return db.words.filter(w => w.deckId === deckId); }
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function escapeHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

/* ============================================================
   НАВИГАЦИЯ
   ============================================================ */
function switchView(view) {
  currentView = view;
  $('viewStudy').classList.toggle('hidden', view !== 'study');
  $('viewManage').classList.toggle('hidden', view !== 'manage');
  $('navStudy').classList.toggle('active', view === 'study');
  $('navManage').classList.toggle('active', view === 'manage');
  
  if (view === 'study') startStudy();
  if (view === 'manage') renderWordList();
}

$('navStudy').onclick = () => switchView('study');
$('navManage').onclick = () => switchView('manage');

/* ============================================================
   РЕНДЕР КОЛОД
   ============================================================ */
function renderDeckTabs() {
  const container = $('deckScroll');
  container.innerHTML = '';
  
  db.decks.forEach(d => {
    const count = getDeckWords(d.id).length;
    const isActive = currentDeckId === d.id;
    
    const wrap = document.createElement('div');
    wrap.style.display = 'flex'; wrap.style.alignItems = 'center'; wrap.style.gap = '4px';

    const btn = document.createElement('button');
    btn.className = 'deck-chip' + (isActive ? ' active' : '');
    btn.innerHTML = `<span class="deck-name">${escapeHtml(d.name)}</span> <span class="count">${count}</span>`;
    btn.onclick = () => {
      if (currentDeckId === d.id) return;
      saveLastDeck(d.id);
      renderDeckTabs();
      if (currentView === 'study') startStudy();
      if (currentView === 'manage') renderWordList();
    };
    wrap.appendChild(btn);

    if (isActive && db.decks.length > 1) {
      const del = document.createElement('button');
      del.className = 'btn-icon danger';
      del.style.width = '28px'; del.style.height = '28px'; del.style.flexShrink = '0';
      del.innerHTML = '✕';
      del.onclick = (e) => {
        e.stopPropagation();
        if (!confirm(`Удалить колоду "${d.name}" и все её слова?`)) return;
        db.decks = db.decks.filter(x => x.id !== d.id);
        db.words = db.words.filter(w => w.deckId !== d.id);
        saveDB(); saveLastDeck(db.decks[0].id);
        renderDeckTabs();
        if (currentView === 'study') startStudy();
        if (currentView === 'manage') renderWordList();
      };
      wrap.appendChild(del);
    }
    container.appendChild(wrap);
  });

  const addBtn = document.createElement('button');
  addBtn.className = 'btn-add-deck';
  addBtn.innerHTML = '+ Новая';
  addBtn.onclick = () => {
    $('newDeckName').value = '';
    $('deckModal').classList.add('show');
  };
  container.appendChild(addBtn);
}

/* ============================================================
   ЛОГИКА ОБУЧЕНИЯ И СТАТИСТИКА
   ============================================================ */
const scene = $('scene'), card = $('card');
const frontWord = $('frontWord'), backWord = $('backWord');
const btnFlip = $('btnFlip'), btnKnow = $('btnKnow'), btnDont = $('btnDont');

function startStudy(customQueue = null) {
  $('studyCardContainer').classList.add('hidden');
  $('studyEmpty').classList.add('hidden');
  $('studyFinish').classList.add('hidden');
  sessionErrors = []; // Сбрасываем ошибки при старте новой сессии

  if (customQueue) {
    studyQueue = shuffle(customQueue);
  } else {
    const words = getDeckWords(currentDeckId);
    if (words.length === 0) {
      $('studyEmpty').classList.remove('hidden');
      updateStudyStats();
      return;
    }
    studyQueue = shuffle(words);
  }
  
  $('studyCardContainer').classList.remove('hidden');
  studyStats = { know: 0, dont: 0 };
  nextStudyCard();
}

function nextStudyCard() {
  if (studyQueue.length === 0) {
    showFinishScreen();
    return;
  }
  
  currentStudyWord = studyQueue[0];
  isFlipped = false; answered = false;
  card.classList.remove('flipped', 'correct', 'wrong');
  frontWord.textContent = currentStudyWord.front;
  backWord.textContent = currentStudyWord.back;
  
  btnKnow.disabled = true; btnDont.disabled = true;
  updateStudyStats();
}

function updateStudyStats() {
  const total = getDeckWords(currentDeckId).length;
  $('statTotal').textContent = total;
  $('statKnow').textContent = studyStats.know;
  $('statDont').textContent = studyStats.dont;
  
  // Прогресс-бар: сколько слов из общего числа уже пройдено (и правильно, и с ошибкой)
  const done = studyStats.know + studyStats.dont;
  const pct = total ? Math.min(100, Math.round((done / total) * 100)) : 0;
  $('progressFill').style.width = pct + '%';
}

function flipCard() {
  if (!currentStudyWord || answered) return;
  isFlipped = !isFlipped;
  card.classList.toggle('flipped', isFlipped);
  btnKnow.disabled = !isFlipped; btnDont.disabled = !isFlipped;
}

function answerCard(known) {
  if (!currentStudyWord || answered) return;
  answered = true;
  btnKnow.disabled = true; btnDont.disabled = true;
  card.classList.add(known ? 'correct' : 'wrong');
  if (!known) scene.classList.add('shake');
  
  const word = studyQueue.shift();
  if (known) {
    studyStats.know++;
  } else {
    studyStats.dont++;
    // Сохраняем в ошибки (если его там еще нет)
    if (!sessionErrors.some(w => w.id === word.id)) {
      sessionErrors.push(word);
    }
    // Возвращаем в конец очереди, чтобы дойти до него снова
    studyQueue.push(word);
  }
  
  updateStudyStats();
  
  setTimeout(() => {
    scene.classList.remove('shake');
    nextStudyCard();
  }, known ? 400 : 600);
}

function showFinishScreen() {
  $('studyCardContainer').classList.add('hidden');
  $('studyFinish').classList.remove('hidden');
  
  $('finishText').textContent = `Изучено: ${studyStats.know} слов. Ошибок: ${studyStats.dont}`;
  
  const errContainer = $('errorListContainer');
  const retryBtn = $('btnRetryErrors');
  
  if (sessionErrors.length > 0) {
    errContainer.classList.remove('hidden');
    retryBtn.classList.remove('hidden');
    
    errContainer.innerHTML = sessionErrors.map(w => `
      <div class="error-item">
        <div class="f">${escapeHtml(w.front)}</div>
        <div class="b">${escapeHtml(w.back)}</div>
      </div>
    `).join('');
  } else {
    errContainer.classList.add('hidden');
    retryBtn.classList.add('hidden');
  }
}

scene.onclick = flipCard;
btnFlip.onclick = flipCard;
btnKnow.onclick = () => answerCard(true);
btnDont.onclick = () => answerCard(false);

$('btnRestart').onclick = () => startStudy();
$('btnRetryErrors').onclick = () => startStudy(sessionErrors);

/* ============================================================
   ЛОГИКА УПРАВЛЕНИЯ СЛОВАМИ
   ============================================================ */
$('btnAddWord').onclick = () => {
  const front = $('inpFront').value.trim();
  const back = $('inpBack').value.trim();
  if (!front || !back) return alert('Заполните оба поля');
  
  if (editingWordId) {
    const w = db.words.find(x => x.id === editingWordId);
    if (w) { w.front = front; w.back = back; }
    editingWordId = null;
    $('btnAddWord').textContent = 'Сохранить';
  } else {
    db.words.push({ id: uid(), front, back, deckId: currentDeckId });
  }
  
  saveDB();
  $('inpFront').value = ''; $('inpBack').value = '';
  $('inpFront').focus();
  
  renderDeckTabs();
  renderWordList();
};

function renderWordList() {
  const search = $('searchInput').value.toLowerCase();
  let words = getDeckWords(currentDeckId);
  
  if (search) {
    words = words.filter(w => 
      w.front.toLowerCase().includes(search) || w.back.toLowerCase().includes(search)
    );
  }
  
  $('wordCount').textContent = getDeckWords(currentDeckId).length;
  const box = $('wordList');
  box.innerHTML = '';
  
  if (words.length === 0) {
    box.innerHTML = '<div class="empty-state">Слов пока нет</div>';
    return;
  }
  
  words.forEach((w) => {
    const item = document.createElement('div');
    item.className = 'word-item';
    item.innerHTML = `
      <div class="word-info">
        <div class="front">${escapeHtml(w.front)}</div>
        <div class="back">${escapeHtml(w.back)}</div>
      </div>
      <div class="word-actions">
        <button class="btn-icon" data-action="edit">✏️</button>
        <button class="btn-icon danger" data-action="delete">✕</button>
      </div>
    `;
    
    item.querySelector('[data-action="edit"]').onclick = () => {
      editingWordId = w.id;
      $('editFront').value = w.front;
      $('editBack').value = w.back;
      $('editModal').classList.add('show');
    };
    
    item.querySelector('[data-action="delete"]').onclick = () => {
      if (!confirm(`Удалить "${w.front}"?`)) return;
      db.words = db.words.filter(x => x.id !== w.id);
      saveDB();
      renderDeckTabs();
      renderWordList();
    };
    
    box.appendChild(item);
  });
}

$('searchInput').addEventListener('input', renderWordList);

/* ============================================================
   МОДАЛКИ
   ============================================================ */
$('btnCancelModal').onclick = () => $('editModal').classList.remove('show');
$('btnSaveEdit').onclick = () => {
  if (!editingWordId) return;
  const w = db.words.find(x => x.id === editingWordId);
  if (!w) return;
  
  const f = $('editFront').value.trim();
  const b = $('editBack').value.trim();
  if (!f || !b) return alert('Заполните оба поля');
  
  w.front = f; w.back = b;
  saveDB();
  $('editModal').classList.remove('show');
  editingWordId = null;
  renderWordList();
};

$('btnCancelDeck').onclick = () => $('deckModal').classList.remove('show');
$('btnCreateDeck').onclick = () => {
  const name = $('newDeckName').value.trim();
  if (!name) return alert('Введите название');
  
  const id = 'deck_' + Date.now();
  db.decks.push({ id, name });
  saveDB();
  
  $('deckModal').classList.remove('show');
  saveLastDeck(id);
  
  renderDeckTabs();
  if (currentView === 'study') startStudy();
  if (currentView === 'manage') renderWordList();
};

/* ============================================================
   INIT
   ============================================================ */
function init() {
  loadDB(() => {
    loadLastDeck((savedId) => {
      if (!savedId || !db.decks.some(d => d.id === savedId)) {
        savedId = db.decks[0]?.id;
        if (savedId) saveLastDeck(savedId);
      }
      
      currentDeckId = savedId;
      renderDeckTabs();
      switchView('study');
    });
  });
}
init();
</script>
</body>
</html>
